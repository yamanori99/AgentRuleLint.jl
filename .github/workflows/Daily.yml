name: Daily

# Cross-platform smoke: scheduled signal only (never required for merge).
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pkg.test (daily) - Julia ${{ matrix.julia-version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    continue-on-error: ${{ matrix.julia-version == '~1.14.0-0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            julia-version: "1.13"
          - os: ubuntu-latest
            arch: x64
            julia-version: "~1.14.0-0"
          - os: windows-latest
            arch: x64
            julia-version: "1.13"
          - os: windows-latest
            arch: x64
            julia-version: "~1.14.0-0"
          # Xcode 27 toolchain image (arm64): actions/runner-images images/macos/xcode-27-arm64-Readme.md
          - os: xcode-27
            arch: arm64
            julia-version: "1.13"
          - os: xcode-27
            arch: arm64
            julia-version: "~1.14.0-0"
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ matrix.julia-version }}

      - uses: ./.github/actions/julia-depot-cache # zizmor: ignore[self-repository]
        with:
          cache-scratchspaces: false

      - name: Instantiate main project
        shell: bash
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Instantiate Runic test env
        shell: bash
        run: julia --startup-file=no --project=test/runic_env -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run tests
        shell: bash
        run: julia --startup-file=no --project=. --color=yes -e 'using Pkg; Pkg.test()'

  mutation_shard:
    name: Mutation tests (daily shard ${{ matrix.shard }}/3) - Julia 1.13 - ubuntu-latest - x64
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      AGENTRULELINT_MUTATION_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13"

      - uses: ./.github/actions/julia-depot-cache # zizmor: ignore[self-repository]
        with:
          cache-scratchspaces: false

      - name: Instantiate main project
        shell: bash
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run mutation harnesses
        shell: bash
        run: julia --startup-file=no --project=. test/mutation/run_all.jl

  mutation:
    name: Mutation tests (daily) - Julia 1.13 - ubuntu-latest - x64
    needs: [mutation_shard]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all mutation shards successful
        shell: bash
        env:
          SHARD_RESULT: ${{ needs.mutation_shard.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "mutation_shard result was $SHARD_RESULT (expected success)" >&2
            exit 1
          fi

  # Issue #120: early signal when JuliaLang/julia master JuliaSyntax breaks tests (not required for merge).
  juliasyntax-master:
    name: Pkg.test (daily, JuliaSyntax master) - Julia 1.13 - ubuntu-latest - x64
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13"

      - uses: ./.github/actions/julia-depot-cache # zizmor: ignore[self-repository]
        with:
          cache-scratchspaces: false

      - name: Report JuliaSyntax pin vs JuliaLang/julia master
        shell: bash
        run: |
          set -euo pipefail
          pin="$(julia --startup-file=no -e 'using TOML; println(TOML.parsefile("Project.toml")["sources"]["JuliaSyntax"]["rev"])')"
          master="$(git ls-remote https://github.com/JuliaLang/julia refs/heads/master | awk '{print $1}')"
          if [[ -z "${master}" ]]; then
            echo "juliasyntax-master-ci: git ls-remote returned no master sha" >&2
            exit 1
          fi
          echo "juliasyntax-master-ci: pinned repo-rev=${pin}"
          echo "juliasyntax-master-ci: JuliaLang/julia master=${master}"

      - name: Resolve JuliaSyntax from julia master
        shell: bash
        run: julia --startup-file=no .github/juliasyntax-master-resolve.jl

      - name: Instantiate main project
        shell: bash
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Instantiate Runic test env
        shell: bash
        run: julia --startup-file=no --project=test/runic_env -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run tests
        shell: bash
        run: julia --startup-file=no --project=. --color=yes -e 'using Pkg; Pkg.test()'
