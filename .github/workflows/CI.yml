name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.version }} — test, Aqua, Runic
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow_failure == true }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.13"
        include:
          - version: nightly
            allow_failure: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: julia-actions/setup-julia@780022b48dfc0c2c6b94cfee6a9284850107d037 # v2.3.0
        with:
          version: ${{ matrix.version }}

      - name: Instantiate main project
        shell: bash
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Instantiate Runic test env
        shell: bash
        run: julia --startup-file=no --project=test/runic_env -e 'using Pkg; Pkg.instantiate(); Pkg.add("Runic")'

      - name: Run tests (includes Aqua and Runic invariance)
        shell: bash
        run: julia --startup-file=no --project=. --color=yes -e 'using Pkg; Pkg.test()'
