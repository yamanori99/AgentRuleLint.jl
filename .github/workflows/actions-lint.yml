name: Actions lint

# actionlint, zizmor, and pinact on workflow files. ShellCheck on tracked shell
# scripts. actionlint and pinact come from `go install` via proxy.golang.org;
# zizmor comes from PyPI. No token: zizmor stays offline, and pinact only
# checks that each uses: is a full commit SHA.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck, actionlint, zizmor, pinact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: shellcheck, actionlint, zizmor, and pinact
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-pip
          shellcheck --version

          export ACTIONS_LINT_GO_SYSTEM=1
          export ACTIONS_LINT_BIN="${RUNNER_TEMP}/gopath/bin"
          export GOPATH="${RUNNER_TEMP}/gopath"
          mkdir -p "${ACTIONS_LINT_BIN}"
          # shellcheck source=actions-lint-setup.sh
          source .github/actions-lint-setup.sh
          actions_lint_install_tools

          actionlint -version
          zizmor --version
          pinact --version

          mapfile -t sh_files < <(git ls-files '*.sh')
          if ((${#sh_files[@]} == 0)); then
            echo "no shell scripts tracked" >&2
            exit 1
          fi
          fail=0
          for f in "${sh_files[@]}"; do
            echo "== shellcheck ${f} =="
            if ! shellcheck -x -P SCRIPTDIR "${f}"; then
              fail=1
            fi
          done
          if (( fail != 0 )); then
            exit 1
          fi

          actionlint
          zizmor --offline --no-progress .github/workflows/actions-lint.yml
          pinact run --fix=false --no-api