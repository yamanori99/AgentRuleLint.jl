# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: jetls-check
description: Install JETLS app and run jetls check (caller must setup-julia + JETLS depot cache restore)

inputs:
  files:
    description: Space-separated Julia files for jetls check
    required: true
  depot-cache-exact:
    description: True when the workflow JETLS depot restore had an exact cache hit
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install jetls
      shell: bash
      env:
        JETLS_DEPOT_CACHE_EXACT: ${{ inputs.depot-cache-exact }}
      run: | # zizmor: ignore[github-env] constant "$HOME/.julia/bin", not attacker input
        set -euo pipefail
        mkdir -p "$HOME/.julia/bin"
        echo "$HOME/.julia/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.julia/bin:$PATH"
        if [[ -z "${JULIA_APPS_JULIA_CMD:-}" ]]; then
          export JULIA_APPS_JULIA_CMD="$(command -v julia)"
        fi
        # `release` moves. A new hint then fails weekly on unchanged code.
        # This tag is that date release. Bump .github/jetls-rev to take a newer JETLS.
        # Pkg.Apps.add deletes and rewrites the app env, and fetches the git
        # repo, even when the depot cache already has the packages. Skip that
        # when this rev and Julia are already restored.
        jetls_rev="$(tr -d '[:space:]' < "${GITHUB_WORKSPACE}/.github/jetls-rev")"
        if [[ ! "${jetls_rev}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
          echo "jetls-check: invalid or missing pin in .github/jetls-rev" >&2
          exit 1
        fi
        jetls_want_version="${jetls_rev//-/.}"
        jetls_have_version=""
        if [[ -f "${HOME}/.julia/environments/apps/JETLS/Project.toml" ]]; then
          jetls_have_version="$(sed -n -E 's/^version = "([^"]+)".*/\1/p' "${HOME}/.julia/environments/apps/JETLS/Project.toml" | head -1)"
        fi
        if [[ "${JETLS_DEPOT_CACHE_EXACT}" == "true" && -x "${HOME}/.julia/bin/jetls" && -f "${HOME}/.julia/environments/apps/JETLS/Manifest.toml" && "${jetls_have_version}" == "${jetls_want_version}" ]]; then
          if jetls version; then
            echo "jetls-startup: depot cache hit; skip Pkg.Apps.add"
            exit 0
          fi
          echo "jetls-startup: depot cache hit but jetls version failed; installing"
        else
          echo "jetls-startup: depot cache miss or pin drift; Pkg.Apps.add"
        fi
        julia --startup-file=no -e "
          using Pkg
          Pkg.Apps.add(; url=\"https://github.com/aviatesk/JETLS.jl\", rev=\"${jetls_rev}\")
        "
    - name: Run jetls check
      shell: bash
      env:
        JETLS_FILES: ${{ inputs.files }}
      run: |
        set -euo pipefail
        export PATH="$HOME/.julia/bin:$PATH"
        if [[ -z "${JULIA_APPS_JULIA_CMD:-}" ]]; then
          export JULIA_APPS_JULIA_CMD="$(command -v julia)"
        fi
        echo "jetls-startup: check begin"
        jetls version
        echo "jetls-startup: version done"
        manifest="${HOME}/.julia/environments/apps/JETLS/Manifest.toml"
        if [[ -f "$manifest" ]]; then
          # The date tag does not name the analyzer. JETLSCore repo-rev does.
          core="$(awk '
            /^\[\[deps\.JETLSCore\]\]$/ { section = "core"; next }
            /^\[\[/ { section = ""; next }
            section == "core" && $1 == "repo-rev" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' "$manifest")"
          echo "jetls core ${core}"
        fi
        # Match aviatesk/JETLS.jl check@release: no `--threads=auto` (segfaults
        # on Julia 1.13 in signature_analysis_worker; exit 139).
        _log="$(mktemp)"
        trap 'rm -f "${_log}"' EXIT
        set +e
        # shellcheck disable=SC2086
        jetls check --quiet --root=. --exit-severity=hint --show-severity=hint --progress=none $JETLS_FILES >"${_log}" 2>&1
        _status=$?
        set -e
        cat "${_log}"
        "${GITHUB_WORKSPACE}/.github/jetls-log-gate.sh" "${_log}"
        if ((_status != 0)); then
          exit "${_status}"
        fi
        echo "jetls-startup: check end"
